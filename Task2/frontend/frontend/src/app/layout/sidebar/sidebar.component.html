<div class="wamis-sidebar-wrapper">
  <!-- Primary WAMIS Vertical Rail: Strictly WMS, AMS, and Integration -->
  <aside class="wamis-sidebar-rail">
    <div class="wamis-rail-items">
      <div *ngFor="let mod of railModules"
           class="wamis-rail-item"
           [class.active]="mod.id === selectedModuleId"
           (click)="selectModule(mod.id)"
           [matTooltip]="mod.name + ' Module'">
        <span class="material-icons wamis-rail-icon">{{ mod.icon }}</span>
        <span class="wamis-rail-label">{{ mod.name }}</span>
      </div>
    </div>
  </aside>

  <!-- Secondary Menu Drawer (Matches Image 3) -->
  <nav class="wamis-sidebar-drawer wamis-second-menu-v3"
       [class.collapsed]="!isExpanded">

    <!-- Header with Module Title and '<' Collapse Arrow (Matches Image 3) -->
    <div class="wamis-drawer-header-v3">
      <span class="wamis-drawer-title-v3">{{ selectedModuleId }}</span>
      <button type="button"
              class="wamis-drawer-collapse-btn"
              (click)="closeDrawer()"
              matTooltip="Collapse menu">
        <span class="material-icons" style="font-size: 18px; color: #ffffff;">chevron_left</span>
      </button>
    </div>

    <!-- Scrollable Drawer Body with Accordion Groups (Matches Image 3) -->
    <div class="wamis-drawer-body-v3">

      <!-- 1. INTEGRATION MODULE: Submenu heading is strictly "Gepnic" (No Master, No Sub Work) -->
      <ng-container *ngIf="selectedModuleId === 'Integration'">
        <div class="wamis-accordion-group">
          <div class="wamis-accordion-header" (click)="toggleGepnic()">
            <span class="wamis-accordion-title">Gepnic</span>
            <span class="material-icons wamis-accordion-chevron">
              {{ isGepnicExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
            </span>
          </div>

          <ul class="wamis-accordion-items" *ngIf="isGepnicExpanded">
            <li *ngFor="let item of gepnicNavItems">
              <a [routerLink]="item.route"
                 routerLinkActive="active"
                 class="wamis-accordion-subitem">
                {{ item.label }}
              </a>
            </li>
          </ul>
        </div>
      </ng-container>

      <!-- 2. WMS MODULE: Submenu heading is strictly "Works" (Only has Sub Work tab) -->
      <ng-container *ngIf="selectedModuleId === 'WMS'">
        <div class="wamis-accordion-group">
          <div class="wamis-accordion-header" (click)="toggleWorks()">
            <span class="wamis-accordion-title">Works</span>
            <span class="material-icons wamis-accordion-chevron">
              {{ isWorksExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
            </span>
          </div>

          <ul class="wamis-accordion-items" *ngIf="isWorksExpanded">
            <li *ngFor="let item of wmsNavItems">
              <a [routerLink]="item.route"
                 routerLinkActive="active"
                 class="wamis-accordion-subitem">
                {{ item.label }}
              </a>
            </li>
          </ul>
        </div>
      </ng-container>

    </div>
  </nav>
</div>
