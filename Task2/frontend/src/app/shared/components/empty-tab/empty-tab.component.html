<div class="wamis-child-section wamis-tab-placeholder" style="background: #ffffff; border: 1.5px dashed #cbd5e1; border-radius: 6px; padding: 48px 24px; text-align: center; margin-bottom: 20px;">
  <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: #f1f5f9; margin-bottom: 16px;">
    <span class="material-icons" style="font-size: 30px; color: #64748b;">construction</span>
  </div>
  <div style="font-size: 16px; font-weight: 600; color: var(--wamis-navy, #0f2c59); margin-bottom: 6px;">
    {{ tabName }}
  </div>
  <div style="font-size: 13.5px; color: #64748b; font-weight: 500; margin-bottom: 12px;">
    {{ message }}
  </div>
  <div style="display: inline-block; padding: 4px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 12px; color: #475569;">
    Under Development &bull; Future Release
  </div>
</div>
