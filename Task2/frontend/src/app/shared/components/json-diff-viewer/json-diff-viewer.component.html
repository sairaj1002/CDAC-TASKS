<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
  <div>
    <div style="font-weight: 600; color: var(--wamis-navy); margin-bottom: 6px;">{{ leftTitle }}</div>
    <pre class="wamis-json-box">{{ formatJson(leftJson) }}</pre>
  </div>
  <div>
    <div style="font-weight: 600; color: var(--wamis-blue); margin-bottom: 6px;">{{ rightTitle }}</div>
    <pre class="wamis-json-box" style="color: #4ade80;">{{ formatJson(rightJson) }}</pre>
  </div>
</div>
