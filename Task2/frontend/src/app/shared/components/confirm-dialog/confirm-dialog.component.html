<div class="wamis-dialog-card">
  <button class="wamis-dialog-close-btn" (click)="onCancel()" matTooltip="Close dialog">✕</button>

  <div class="wamis-dialog-body">
    <div class="wamis-dialog-title">{{ data.title || 'Delete Work?' }}</div>
    <div class="wamis-dialog-subtitle">{{ data.message || 'Are you sure?' }}</div>
  </div>

  <div class="wamis-dialog-actions">
    <button class="wamis-btn-primary" (click)="onConfirm()" matTooltip="Proceed with action">
      {{ data.okText || 'Ok' }}
    </button>
    <button class="wamis-btn-danger" (click)="onCancel()" matTooltip="Cancel action">
      {{ data.cancelText || 'Cancel' }}
    </button>
  </div>
</div>
