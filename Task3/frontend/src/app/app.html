<div class="wamis-app-root">
  <app-wamis-header (toggleSidebar)="toggleSidebar()"></app-wamis-header>

  <div class="wamis-layout-container">
    <app-wamis-sidebar
      *ngIf="sidebarVisible"
      [activeSubMenu]="activeSubMenu"
      (subMenuSelected)="onSubMenuSelected($event)"
    ></app-wamis-sidebar>

    <main class="wamis-content">
      <app-wamis-master [activeSubMenu]="activeSubMenu"></app-wamis-master>
    </main>
  </div>

  <app-wamis-footer></app-wamis-footer>
</div>
