<aside class="wamis-sidebar-wrapper">
  <div class="wamis-sidebar-rail">
    <div class="wamis-rail-items">
      <div
        *ngFor="let item of navItems"
        class="wamis-rail-item"
        [class.active]="activeTab === item.id"
        (click)="selectNav(item.id)"
        [matTooltip]="item.label"
        matTooltipPosition="right"
      >
        <mat-icon class="wamis-rail-icon">{{ item.icon }}</mat-icon>
        <span class="wamis-rail-label">{{ item.label }}</span>
      </div>
    </div>
  </div>
</aside>
