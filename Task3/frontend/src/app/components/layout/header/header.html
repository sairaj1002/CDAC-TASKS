<!-- Master Top Government Banner matching Uploaded Image -->
<header class="wamis-topbar">
  <div class="wamis-topbar-left">
    <div class="wamis-emblem">
      <svg class="wamis-emblem-svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="wamis-topbar-title">{{ appFullName }}</span>
  </div>

  <div class="wamis-topbar-right">
    <button type="button" class="wamis-topbar-btn" matTooltip="Language & Region" aria-label="Language">
      <mat-icon>language</mat-icon>
    </button>
  </div>
</header>

<!-- Sub-Header Bar with Division Office Pill & VKJ Avatar matching Uploaded Image -->
<div class="wamis-subbar">
  <div class="wamis-subbar-left">
    <button type="button" class="wamis-hamburger-btn" (click)="toggleSidebar.emit()" aria-label="Toggle Menu">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="wamis-division-container">
      <div class="wamis-division-pill" (click)="toggleDropdown()">
        <span class="wamis-division-name">{{ activeDivision }}</span>
        <span class="wamis-clear-cross" (click)="clearDivision($event)">✕</span>
      </div>

      <div class="wamis-division-dropdown" *ngIf="showDivisionDropdown">
        <div
          *ngFor="let div of divisions"
          class="wamis-division-option"
          [class.selected]="div === activeDivision"
          (click)="selectDivision(div)"
        >
          {{ div }}
        </div>
      </div>
    </div>
  </div>

  <div class="wamis-subbar-right">
    <div class="wamis-avatar-circle" matTooltip="User Profile - Vaishali Kuldeep Jaiswal (EE)" aria-label="User Avatar">
      {{ avatarText }}
    </div>
  </div>
</div>
