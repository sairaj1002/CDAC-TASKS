<div class="wamis-subwork-container">
  <!-- 1. Active WMS Module: Pre Tender Screen -->
  <div *ngIf="activeSubMenu === 'pretender' || activeSubMenu === 'sub-work-details'">
    <app-pretender-form></app-pretender-form>
  </div>

  <!-- 2. Master Module: GEPNIC Configuration (Matches Image 1) -->
  <div *ngIf="activeSubMenu === 'gepnic-config'">
    <app-gepnic-config></app-gepnic-config>
  </div>

  <!-- 3. Master Module: GEPNIC Tender Configuration -->
  <div *ngIf="activeSubMenu === 'gepnic-tender-config'">
    <app-gepnic-tender-config></app-gepnic-tender-config>
  </div>

  <!-- Fallback/Placeholder for other WMS Submenus -->
  <div *ngIf="activeSubMenu !== 'pretender' && activeSubMenu !== 'sub-work-details' && activeSubMenu !== 'gepnic-config' && activeSubMenu !== 'gepnic-tender-config'" class="component-details-panel">
    <div class="wamis-tab-placeholder">
      <h3 class="wamis-section-title">{{ activeSubMenu | uppercase }}</h3>
      <p class="wamis-note">This section is part of the WMS module. Switch to "Pre Tender" or "GEPNIC Configuration" in the sidebar to view active pages.</p>
    </div>
  </div>
</div>
