<div class="wamis-subwork-container">
  <!-- Master Navigation Tabs matching Authentic WAMIS UI -->
  <nav class="wamis-primary-tabs" aria-label="Main Navigation">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="wamis-primary-tab"
      [class.active]="activeTabIndex === tab.id"
      (click)="selectTab(tab.id)"
    >
      <mat-icon>{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </button>
  </nav>

  <!-- Child Component Views (Enterprise Master-Child Architecture) -->
  <section class="wamis-view-container">
    <!-- View 0: List of Works (Matches Image 2 & 6) -->
    <div *ngIf="activeTabIndex === 0">
      <app-work-list
        (navigateToForm)="onNavigateToForm()"
        (editPreTender)="onEditPreTender($event)"
      ></app-work-list>
    </div>

    <!-- View 1: Pre-Tender Entry Form -->
    <div *ngIf="activeTabIndex === 1">
      <app-pretender-form
        [editingTender]="selectedTenderForEdit"
        (formSubmitted)="onFormSubmitted()"
        (formCancelled)="onFormCancelled()"
      ></app-pretender-form>
    </div>

    <!-- View 2: Master Dropdowns Management -->
    <div *ngIf="activeTabIndex === 2">
      <app-dropdown-master></app-dropdown-master>
    </div>

    <!-- View 3: GePNIC Integration Jobs & Immutable Audit Log -->
    <div *ngIf="activeTabIndex === 3">
      <app-transaction-audit></app-transaction-audit>
    </div>
  </section>
</div>
