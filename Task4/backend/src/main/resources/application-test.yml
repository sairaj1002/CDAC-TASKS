spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true # creates wamis_intergation in H2
    # load test masters after Hibernate has created the tables
    defer-datasource-initialization: true
  sql:
    init:
      # db/*.sql are PostgreSQL-only; tests use a small H2 master set instead
      mode: always
      # Hibernate creates the tables in tests; no schema script
      schema-locations: optional:classpath:db/none.sql
      data-locations: classpath:db/test-masters.sql

integration:
  gepnic:
    enabled: true
    environment: test
    base-url: http://localhost:8089
    connect-timeout: 2s
    read-timeout: 5s
    unique-user-id: TEST_USER_001
    key-id: TEST-KEY-001
