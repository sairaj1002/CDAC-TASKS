<div class="container-fluid p-3">
  <div class="d-flex align-items-center mb-2">
    <span class="page-title">Pre-Tender Details</span>
  </div>

  <mat-tab-group animationDuration="0ms" [mat-stretch-tabs]="false" mat-align-tabs="start"
    [selectedIndex]="selectedTabIndex" (selectedTabChange)="onTabChange($event)">
    <mat-tab [label]="selectedTenderForEdit ? 'Edit' : 'Add'">
      @if (selectedTabIndex === 0) {
        <div class="pt-3">
          <app-pretender-form
            [editingTender]="selectedTenderForEdit"
            (formSubmitted)="onFormSubmitted()"
            (formCancelled)="onFormCancelled()"
          ></app-pretender-form>
        </div>
      }
    </mat-tab>
    <mat-tab label="View">
      @if (selectedTabIndex === 1) {
        <div class="pt-3">
          <app-work-list (editPreTender)="onEditPreTender($event)"></app-work-list>
        </div>
      }
    </mat-tab>
  </mat-tab-group>
</div>
