<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Bridge Details</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <hr />
    <div class="bridge-component-table-wrapper">
      <table mat-table [dataSource]="dataSource" class="bridge-component-table">
        <ng-container matColumnDef="serialNumber">
          <th mat-header-cell *matHeaderCellDef>Sr No.</th>
          <td mat-cell *matCellDef="let component; let i = index">{{ getSerialNumber(i) }}</td>
        </ng-container>

        <ng-container matColumnDef="riverNallahBarrier">
          <th mat-header-cell *matHeaderCellDef>River/Nallah/Barrier</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field
              label="Name of River/Nallah/Barrier"
              [value]="component.riverNallahBarrier"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="width">
          <th mat-header-cell *matHeaderCellDef>Width</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="Width" [value]="component.width" />
          </td>
        </ng-container>

        <ng-container matColumnDef="length">
          <th mat-header-cell *matHeaderCellDef>Length</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="Length" [value]="component.length" />
          </td>
        </ng-container>

        <ng-container matColumnDef="approvalRoad">
          <th mat-header-cell *matHeaderCellDef>Approval Road</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="Approval Road" [value]="component.approvalRoad" />
          </td>
        </ng-container>

        <ng-container matColumnDef="numberOfSpans">
          <th mat-header-cell *matHeaderCellDef>No. Of Spans</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="No. Of Spans" [value]="component.numberOfSpans" />
          </td>
        </ng-container>

        <ng-container matColumnDef="spanLength">
          <th mat-header-cell *matHeaderCellDef>Span Length</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="Span Length" [value]="component.spanLength" />
          </td>
        </ng-container>

        <ng-container matColumnDef="bridgeActivity">
          <th mat-header-cell *matHeaderCellDef>Bridge Activity</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field label="Bridge Activity" [value]="component.bridgeActivity" />
          </td>
        </ng-container>

        <ng-container matColumnDef="otherActivityDescription">
          <th mat-header-cell *matHeaderCellDef>Other Activity Description</th>
          <td mat-cell *matCellDef="let component">
            <app-bridge-readonly-field
              label="Other Activity Description"
              [value]="component.otherActivityDescription"
            />
          </td>
        </ng-container>

        <ng-container matColumnDef="audit">
          <th mat-header-cell *matHeaderCellDef>Audit</th>
          <td mat-cell *matCellDef="let component">
            <button
              mat-icon-button
              type="button"
              aria-label="View bridge audit history"
              title="Audit history"
              (click)="viewAudit(component)"
            >
              <mat-icon aria-hidden="true">history</mat-icon>
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let component">
            <div class="bridge-row-actions">
              <button
                mat-icon-button
                type="button"
                aria-label="View bridge details"
                title="View"
                (click)="viewComponent(component)"
              >
                <mat-icon aria-hidden="true">visibility</mat-icon>
              </button>
              <button
                mat-icon-button
                type="button"
                aria-label="Edit bridge"
                title="Edit"
                (click)="edit(component)"
              >
                <mat-icon aria-hidden="true">edit</mat-icon>
              </button>
              <button
                mat-icon-button
                type="button"
                aria-label="Delete bridge"
                title="Delete"
                (click)="delete(component)"
              >
                <mat-icon aria-hidden="true">delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No components have been added yet.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [pageSize]="5"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      aria-label="Select component table page"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
