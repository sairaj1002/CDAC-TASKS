<h2 mat-dialog-title>Bridge Component Details</h2>

<mat-dialog-content>
  <div class="bridge-form-table-wrapper">
    <table class="bridge-form-table bridge-details-table">
      <thead>
        <tr>
          <th scope="col">Sr No.</th>
          <th scope="col">Name of River/Nallah/Barrier</th>
          <th scope="col">Approval Road</th>
          <th scope="col">Width</th>
          <th scope="col">Length</th>
          <th scope="col">No. Of Spans</th>
          <th scope="col">Span Length</th>
          <th scope="col">Bridge Activity</th>
          <th *ngIf="component.bridgeActivity === 'Other Activity'" scope="col">
            Other Activity Description
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="bridge-serial-number">{{ data.serialNumber }}</td>
          <td>
            <app-bridge-readonly-field
              label="Name of River/Nallah/Barrier"
              [value]="component.riverNallahBarrier"
            />
          </td>
          <td>
            <app-bridge-readonly-field label="Approval Road" [value]="component.approvalRoad" />
          </td>
          <td><app-bridge-readonly-field label="Width" [value]="component.width" /></td>
          <td><app-bridge-readonly-field label="Length" [value]="component.length" /></td>
          <td>
            <app-bridge-readonly-field label="No. Of Spans" [value]="component.numberOfSpans" />
          </td>
          <td>
            <app-bridge-readonly-field label="Span Length" [value]="component.spanLength" />
          </td>
          <td>
            <app-bridge-readonly-field label="Bridge Activity" [value]="component.bridgeActivity" />
          </td>
          <td *ngIf="component.bridgeActivity === 'Other Activity'">
            <app-bridge-readonly-field
              label="Other Activity Description"
              [value]="component.otherActivityDescription"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Close</button>
</mat-dialog-actions>
