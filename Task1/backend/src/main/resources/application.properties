spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Database Configurations
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/work_management_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sunbeam}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Forces Spring Boot to always execute your scripts on startup
spring.sql.init.mode=always

# POINT TO BOTH SEPARATE FILES
# spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Ensures data.sql runs AFTER Hibernate sets up the tables to prevent missing table errors
spring.jpa.defer-datasource-initialization=true

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Hibernate Envers Configuration
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Custom Application Properties
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
